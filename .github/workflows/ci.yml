name: ci

on:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README*.md"
  push:
    branches:
      - "feat/**"
      - "main"
      - "release/**"
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "README*.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests with coverage
        run: ./scripts/go-coverage.sh

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-go-coverage
          path: coverage.out
          if-no-files-found: warn

  web-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run web mock tests with coverage
        run: npm run test:web:coverage

      - name: Upload web coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-web-coverage
          path: coverage/**
          if-no-files-found: warn
  
  sonar-check:
    runs-on: ubuntu-latest
    needs:
      - test
      - web-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Go coverage
        uses: actions/download-artifact@v4
        with:
          name: fast-go-coverage
          path: .

      - name: Download Web coverage
        uses: actions/download-artifact@v4
        with:
          name: fast-web-coverage
          path: coverage

      - name: Set up SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - test
      - web-test
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: scheduler-worker
            dockerfile: Dockerfile.worker
          - name: web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: woms-${{ matrix.name }}:ci

  helm-render:
    runs-on: ubuntu-latest
    needs:
      - test
      - web-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build Helm dependencies
        run: helm dependency build ./deploy/helm/woms

      - name: Render Helm chart
        run: helm template woms ./deploy/helm/woms --set api.jwtSecret=ci-dummy >/tmp/woms-rendered.yaml

      - name: Verify scheduler worker HPA render
        run: RENDERED_MANIFEST=/tmp/woms-rendered.yaml ./scripts/verify-hpa-render.sh
