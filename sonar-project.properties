sonar.projectKey=WOMS
sonar.projectName=WOMS
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.mjs
sonar.exclusions=coverage/**,node_modules/**,.scannerwork/**,.sonar/**,.git/**,.github/**,docs/**,README*.md,**/*.md
sonar.coverage.exclusions=**/*_test.go,**/*.test.mjs,coverage/**,node_modules/**,.scannerwork/**,.sonar/**,.github/**,docs/**,README*.md,**/*.md
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=coverage/lcov.info
